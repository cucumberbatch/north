# Bindings of the remote gamepad (web interface of the remote input server).
#
# Copy this file into the working directory of the engine (or point the system property
# "north.remote.gamepad.bindings" to it) to change the bindings without recompiling the engine.
#
# Supported properties per control:
#   <control>.key       - the key which is pressed by the control
#   <control>.axis      - the name of the analog axis of the control
#   <control>.negative  - the key which is pressed when the axis is moved into the negative range
#   <control>.positive  - the key which is pressed when the axis is moved into the positive range
#
# Key names are the GLFW key names, e.g. SPACE, ESCAPE, W, A, S, D, LEFT_SHIFT, UP, F1.

# face buttons
a.key=SPACE
b.key=ESCAPE
x.key=I
y.key=Y

# direction pad
dpad_up.key=UP
dpad_down.key=DOWN
dpad_left.key=LEFT
dpad_right.key=RIGHT

# shoulder buttons
l1.key=Q
r1.key=E

# triggers
l2.axis=l2
l2.key=LEFT_CONTROL
r2.axis=r2
r2.key=RIGHT_CONTROL

# system buttons
start.key=ENTER
select.key=G
pause.key=P
lmb.key=MOUSE_LEFT

# analog sticks
left_x.axis=leftX
left_x.negative=A
left_x.positive=D
left_y.axis=leftY
left_y.negative=S
left_y.positive=W
right_x.axis=rightX
right_x.negative=LEFT
right_x.positive=RIGHT
right_y.axis=rightY
right_y.negative=DOWN
right_y.positive=UP
